[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-leak-baseline"
version = "0.1.0"
description = "Acoustic features and logistic regression for grouped leak-sound classification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Zheng Li"}]
dependencies = ["numpy>=1.26", "scipy>=1.12", "scikit-learn>=1.4"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/ox10cx10/acoustic-leak-baseline"

[tool.setuptools.packages.find]
include = ["acoustic_leak*"]
